# Experiment stack — the sole compose file for the study.
#
# What this compose runs:
#   livekit + redis              — LiveKit server + state store
#   weaviate                     — RAG vector DB (tools may query it)
#   reverse-tunnel               — exposes RPi's LiveKit on woska's
#                                  localhost so the experiment workers
#                                  on woska can reach it
#   bridge                       — Pepper hardware (animations / LEDs)
#   audio-bridge                 — Pepper mic/speaker into LiveKit
#   experiment-orchestrator      — creates the fixed `pepper-experiment`
#                                  room and writes tokens to
#                                  livekit_session.json (which bridge +
#                                  audio-bridge already poll). No agent
#                                  dispatch, no state polling.
#   tablet-server                — Pepper's tablet UI (chat + state
#                                  pills) during the experiment.
#   safe-startup                 — boot-time pose watchdog (hands down,
#                                  neutral, baseline volume).
#
# Bring everything up:
#   docker compose -f docker/docker-compose.experiment.yml up -d
#
# Bring everything down:
#   docker compose -f docker/docker-compose.experiment.yml down

services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    env_file: ../.env
    command:
      - --config=/livekit/livekit.yaml
      - --keys=${LIVEKIT_KEYS}
    volumes:
      - ./livekit:/livekit:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  experiment-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/experiment/orchestrator.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_HOST_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      EXPERIMENT_ROOM_NAME: pepper-experiment
    network_mode: host
    depends_on:
      - livekit
      - redis
    restart: unless-stopped

  # Both experiment workers (Mode A `pepper-experiment` and Mode B
  # `pepper-experiment-4o`) run on woska, not on the RPi — launcher.py
  # dispatches them remotely via their agent names. They are
  # intentionally NOT defined in this compose file.

  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/src/bridge.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_OUTPUT_VOLUME: ${PEPPER_OUTPUT_VOLUME:-100}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-100}
      BRIDGE_BIND_HOST: "0.0.0.0"
      HEAD_LOCK_ENABLED: "false"
      HEAD_LOCK_PITCH_RAD: "-0.30"
      BRIDGE_URL: http://0.0.0.0:5000
      # Audio is now streamed via ssh+paplay from audio-bridge directly
      # to Pepper's PulseAudio — bridge.py no longer accepts TCP audio
      # or calls sendRemoteBufferToOutput. TCP_PORT and
      # PEPPER_PLAYBACK_BATCH_FRAMES are intentionally absent.
    network_mode: host
    restart: unless-stopped

  # Watchdog that puts Pepper into a known-safe pose on boot (hands
  # down, neutral stance, baseline volume) before the bridge takes
  # over. Without this, she can boot in whatever pose the previous
  # session left her in — often arms in the air.
  safe-startup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/scripts/safe_startup_watchdog.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-100}
    network_mode: host
    restart: unless-stopped

  audio-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/audio_bridge.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      # Audio path is LiveKit → ssh+paplay → Pepper PulseAudio.
      # Override the SSH target / credentials via .env if Pepper's IP
      # changes or its `nao` password is not the stock value.
      PEPPER_SSH_HOST: ${PEPPER_SSH_HOST:-10.42.0.205}
      PEPPER_SSH_USER: ${PEPPER_SSH_USER:-nao}
      PEPPER_SSH_PASSWORD: ${PEPPER_SSH_PASSWORD:-Argus}
      PEPPER_PAPLAY_LATENCY_MS: ${PEPPER_PAPLAY_LATENCY_MS:-30}
    network_mode: host
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  # user-client is the missing piece for input audio: it joins the room
  # as identity `user` and publishes the USB microphone (DJI) into
  # LiveKit. Without it, the agent has no `user` participant to listen
  # to and the worker's wait_for_user_participant() blocks forever.
  user-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/user_client.py"]
    volumes:
      - ..:/workspace
    devices:
      - /dev/snd:/dev/snd
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      USER_MIC_DEVICE: "DJI"
      USER_MIC_BLOCKSIZE: "2400"   # 50 ms @ 48 kHz (was 4800 / 100 ms historically)
    network_mode: host
    pid: host
    privileged: true
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  tablet-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/tablet_server.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      BRIDGE_URL: http://127.0.0.1:5000
    network_mode: host
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  reverse-tunnel:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache autossh openssh-client &&
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=accept-new \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -J navarlu2@halmos.felk.cvut.cz \
          -R 7880:127.0.0.1:7880 \
          -R 7881:127.0.0.1:7881 \
          -R 7443:127.0.0.1:7443 \
          -R 5000:127.0.0.1:5000 \
          -R 8080:127.0.0.1:8080 \
          -R 50051:127.0.0.1:50051 \
          navarlu2@woska
    volumes:
      - /home/lucas/.ssh:/root/.ssh
    network_mode: host
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.35.1
    env_file: ../.env
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      ENABLE_MODULES: text2vec-openai
      OPENAI_APIKEY: ${OPENAI_API_KEY}
