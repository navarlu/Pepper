# Experiment stack — minimal sibling of docker-compose.yml.
#
# What this compose runs:
#   livekit + redis              — same as production
#   weaviate                     — same as production (tools may use it)
#   reverse-tunnel               — same as production (exposes RPi's
#                                  LiveKit on woska's localhost so the
#                                  pepper-experiment worker reaches it)
#   bridge                       — Pepper hardware (animations / LEDs)
#   audio-bridge                 — Pepper mic/speaker into LiveKit
#   experiment-orchestrator      — REPLACES production orchestrator.
#                                  Creates the fixed `pepper-experiment`
#                                  room and writes tokens to the same
#                                  livekit_session.json file the bridge
#                                  + audio-bridge already poll. No
#                                  agent dispatch, no state polling.
#
# What this compose does NOT run (intentional):
#   voice-agent (production agent) — replaced by experiment/agent.py on
#                                    woska, dispatched by experiment/launcher.py
#   tablet-server                — included so Pepper's tablet shows the
#                                  live chat + state pills during the
#                                  experiment (same definition as the
#                                  production stack).
#   ssh-tunnel                   — only needed for production flows
#
# safe-startup IS included (added because Pepper would otherwise boot
# in whatever pose the previous session left her in — often arms up).
#
# Toggle:
#   docker compose -f docker/docker-compose.yml down
#   docker compose -f docker/docker-compose.experiment.yml up -d
#
# Restore production:
#   docker compose -f docker/docker-compose.experiment.yml down
#   docker compose -f docker/docker-compose.yml up -d

services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    env_file: ../.env
    command:
      - --config=/livekit/livekit.yaml
      - --keys=${LIVEKIT_KEYS}
    volumes:
      - ./livekit:/livekit:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  experiment-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/experiment/orchestrator.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_HOST_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      EXPERIMENT_ROOM_NAME: pepper-experiment
    network_mode: host
    depends_on:
      - livekit
      - redis
    restart: unless-stopped

  # Mode B (realtime) and Mode C (4o-chained) workers run on woska,
  # not on the RPi — launcher.py dispatches them remotely via the
  # `pepper-experiment-realtime` / `pepper-experiment-4o` agent names.
  # They are intentionally NOT defined in this compose file. Mode A
  # (`pepper-experiment`) also runs on woska.

  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/src/bridge.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_OUTPUT_VOLUME: ${PEPPER_OUTPUT_VOLUME:-100}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-100}
      BRIDGE_BIND_HOST: "0.0.0.0"
      TCP_PORT: "55555"
      HEAD_LOCK_PITCH_RAD: "-0.23"
      BRIDGE_URL: http://0.0.0.0:5000
      # Slightly faster first-chunk than the production default 1600 =
      # 100 ms gather. At 800 (50 ms) we shave ~50 ms off the audio
      # pre-roll while staying above NAOqi's per-call overhead floor.
      # Going lower (e.g. 320) flooded the bridge with `WARNING slow
      # sendRemoteBufferToOutput` because each `sendRemoteBufferToOutput`
      # call costs ~30–40 ms regardless of payload — at 20 ms batches
      # you can't keep up with realtime.
      PEPPER_PLAYBACK_BATCH_FRAMES: "800"
    network_mode: host
    restart: unless-stopped

  # Watchdog that puts Pepper into a known-safe pose on boot (hands
  # down, neutral stance, baseline volume) before the bridge takes
  # over. Without this, she can boot in whatever pose the previous
  # session left her in — often arms in the air. Same definition as
  # the production stack.
  safe-startup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/scripts/safe_startup_watchdog.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-100}
    network_mode: host
    restart: unless-stopped

  audio-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/audio_bridge.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      TCP_HOST: 127.0.0.1
      TCP_PORT: 55555
    network_mode: host
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  # user-client is the missing piece for input audio: it joins the room
  # as identity `user` and publishes the USB microphone (DJI) into
  # LiveKit. Without it, the agent has no `user` participant to listen
  # to and the worker's wait_for_user_participant() blocks forever.
  user-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/user_client.py"]
    volumes:
      - ..:/workspace
    devices:
      - /dev/snd:/dev/snd
    # group_add (audio) inherited from base docker-compose.yml — don't redeclare,
    # compose concatenates list overrides and rejects duplicate group_add entries.
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      USER_MIC_DEVICE: "DJI"
      USER_MIC_BLOCKSIZE: "2400"   # 50 ms @ 48 kHz; production default is 4800 (100 ms)
    network_mode: host
    pid: host
    privileged: true
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  tablet-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/tablet_server.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      BRIDGE_URL: http://127.0.0.1:5000
    network_mode: host
    depends_on:
      - experiment-orchestrator
    restart: unless-stopped

  reverse-tunnel:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache autossh openssh-client &&
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=accept-new \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -J navarlu2@halmos.felk.cvut.cz \
          -R 7880:127.0.0.1:7880 \
          -R 7881:127.0.0.1:7881 \
          -R 7443:127.0.0.1:7443 \
          -R 5000:127.0.0.1:5000 \
          -R 8080:127.0.0.1:8080 \
          -R 50051:127.0.0.1:50051 \
          navarlu2@woska
    volumes:
      - /home/lucas/.ssh:/root/.ssh
    network_mode: host
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.35.1
    env_file: ../.env
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      ENABLE_MODULES: text2vec-openai
      OPENAI_APIKEY: ${OPENAI_API_KEY}
