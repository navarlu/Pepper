# RPi-only services — voice-agent running locally on RPi instead of GPU server.
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.rpi.yml --env-file .env up -d
services:
  voice-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "-m", "voice-agent.src.agent", "dev"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://host.docker.internal:7880
      SESSION_MANAGER_URL: http://session-manager:8787
      WEAVIATE_HOST: weaviate
      ANIMATION_BRIDGE_URL: http://host.docker.internal:5000
      DEV_CONSOLE_URL: http://dev-console:8788
      LOCAL_LLM_BASE_URL: http://host.docker.internal:8000/v1
      LOCAL_LLM_MODEL: Qwen/Qwen2.5-7B-Instruct
      LOCAL_TTS_MODEL_PATH: /workspace/voice-agent/models/piper/en_US-hfc_female-medium.onnx
      LOCAL_TTS_SPEAKER_ID: ${LOCAL_TTS_SPEAKER_ID:-}
      LOCAL_TTS_LENGTH_SCALE: ${LOCAL_TTS_LENGTH_SCALE:-1.0}
      LOCAL_TTS_NOISE_SCALE: ${LOCAL_TTS_NOISE_SCALE:-0.667}
      LOCAL_TTS_NOISE_W_SCALE: ${LOCAL_TTS_NOISE_W_SCALE:-0.8}
      PEPPER_AGENT_MODE: ${PEPPER_AGENT_MODE:-openai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s
    depends_on:
      - livekit
      - redis
      - weaviate
    restart: unless-stopped
