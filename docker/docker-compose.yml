services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    env_file: ../.env
    command:
      - --config=/livekit/livekit.yaml
      - --keys=${LIVEKIT_KEYS}
    volumes:
      - ./livekit:/livekit:ro
    # Bridge networking (NOT host) so the container sees only eth0+lo.
    # With node_ip=127.0.0.1 this makes loopback the only advertised ICE
    # candidate — matches the proven connection_test setup that worked
    # over the SSH reverse tunnel from woska.
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/orchestrator.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_HOST_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      PEPPER_AGENT_MODE: openai
      PEPPER_AGENT_NAME_OPENAI: pepper-openai
      PEPPER_AGENT_NAME_LOCAL: pepper-local
      SESSION_IDLE_TIMEOUT_SEC: 60
    network_mode: host
    depends_on:
      - livekit
      - redis
    restart: unless-stopped

  voice-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "-m", "voice-agent.src.live.agent", "dev"]
    env_file: ../.env
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      WEAVIATE_HOST: 127.0.0.1
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      ANIMATION_BRIDGE_URL: http://127.0.0.1:5000
      PEPPER_AGENT_NAME: pepper-openai
      PEPPER_AGENT_MODE: openai
      SESSION_IDLE_TIMEOUT_SEC: 60
    network_mode: host
    stop_grace_period: 15s
    restart: unless-stopped

  # Experiment mode lives in a separate compose file
  # (docker/docker-compose.experiment.yml). To switch:
  #   docker compose -f docker/docker-compose.yml down
  #   docker compose -f docker/docker-compose.experiment.yml up -d
  # The experiment worker itself runs on woska in tmux — see
  # docs/notes/cmd.md and scripts/experiment/sync_to_woska.sh.

  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/src/bridge.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_OUTPUT_VOLUME: ${PEPPER_OUTPUT_VOLUME:-30}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-30}
      BRIDGE_BIND_HOST: "0.0.0.0"
      TCP_PORT: "55555"
      BRIDGE_URL: http://0.0.0.0:5000
    network_mode: host
    restart: unless-stopped

  safe-startup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/scripts/safe_startup_watchdog.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      PEPPER_SAFE_STARTUP_VOLUME: ${PEPPER_SAFE_STARTUP_VOLUME:-30}
    network_mode: host
    restart: unless-stopped

  audio-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/audio_bridge.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      TCP_HOST: 127.0.0.1
      TCP_PORT: 55555
    network_mode: host
    restart: unless-stopped

  user-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/user_client.py"]
    volumes:
      - ..:/workspace
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      USER_MIC_DEVICE: "DJI"
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped

  tablet-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/live/tablet_server.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_SESSION_FILE: /workspace/services/data/token-latest.json
      BRIDGE_URL: http://127.0.0.1:5000
    network_mode: host
    depends_on:
      - orchestrator
    restart: unless-stopped

  # Reverse tunnel: exposes RPi services on woska:localhost so the remote voice-agent can reach them.
  # Also keeps the forward tunnel for vLLM (woska:8000 → RPi:8000) for local-mode fallback.
  reverse-tunnel:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache autossh openssh-client &&
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=accept-new \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -J navarlu2@halmos.felk.cvut.cz \
          -R 7880:127.0.0.1:7880 \
          -R 7881:127.0.0.1:7881 \
          -R 7443:127.0.0.1:7443 \
          -R 5000:127.0.0.1:5000 \
          -R 8080:127.0.0.1:8080 \
          -R 50051:127.0.0.1:50051 \
          navarlu2@woska
    volumes:
      - /home/lucas/.ssh:/root/.ssh
    network_mode: host
    restart: unless-stopped

  # Forward tunnel: woska:8000 → RPi:8000 (for running voice-agent locally with remote vLLM)
  ssh-tunnel:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache autossh openssh-client &&
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=accept-new \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -J navarlu2@halmos.felk.cvut.cz \
          -L 0.0.0.0:8000:127.0.0.1:8000 \
          navarlu2@woska
    volumes:
      - /home/lucas/.ssh:/root/.ssh:ro
    network_mode: host
    restart: unless-stopped

  weaviate:
      image: cr.weaviate.io/semitechnologies/weaviate:1.35.1
      env_file: ../.env
      ports:
        - "8080:8080"
        - "50051:50051"
      restart: unless-stopped
      environment:
        QUERY_DEFAULTS_LIMIT: 25
        AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
        PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
        DEFAULT_VECTORIZER_MODULE: text2vec-openai
        ENABLE_MODULES: text2vec-openai
        OPENAI_APIKEY: ${OPENAI_API_KEY}
        CLUSTER_HOSTNAME: "node1"
      volumes:
        - ./weaviate_data:/var/lib/weaviate
