services:
  livekit:
    image: livekit/livekit-server:v1.9.11
    command:
      - --dev
      - --bind=0.0.0.0
      - --port=7880
      - --udp-port=7882
      - --keys=${LIVEKIT_KEYS}
      - --redis-host=redis:6379
    ports:
      - "7880:7880/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  voice-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "-m", "voice-agent.src.agent", "dev"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://livekit:7880
      SESSION_MANAGER_URL: http://session-manager:8787
      WEAVIATE_HOST: weaviate
      ANIMATION_BRIDGE_URL: http://host.docker.internal:5000
      DEV_CONSOLE_URL: http://dev-console:8788
      LOCAL_LLM_BASE_URL: http://host.docker.internal:8000/v1
      LOCAL_LLM_MODEL: Qwen/Qwen2.5-7B-Instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit
      - redis
      - weaviate
    restart: unless-stopped

  session-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/session_manager.py"]
    volumes:
      - ..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LIVEKIT_HOST_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_HTTP_URL: http://livekit:7880
      BRIDGE_URL: http://host.docker.internal:5000
      SESSION_MANAGER_HOST: 0.0.0.0
      SESSION_MANAGER_PORT: 8787
      LIVEKIT_SESSION_FILE: /workspace/data/token-latest.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      BRIDGE_TCP_URL: tcp://host.docker.internal:55555
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DEV_CONSOLE_URL: http://dev-console:8788
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8787:8787"
    depends_on:
      - livekit
      - redis
      - weaviate
    restart: unless-stopped

  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/src/bridge.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      BRIDGE_BIND_HOST: "0.0.0.0"
      TCP_PORT: "55555"
      BRIDGE_URL: http://0.0.0.0:5000
    network_mode: host
    restart: unless-stopped

  safe-startup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "robot/utils/safe_startup_watchdog.py"]
    volumes:
      - ..:/workspace
      - /home/lucas/Projects/FEL/QI_test/libqi-python/build/build/linux-armv8-gcc-release:/opt/qi
      - /home/lucas/.conan2/p/b/boost00dddf9f5dc9e/p/lib:/opt/boost-lib
      - /home/lucas/Projects/FEL/QI_test/local_qi/lib:/opt/qi-native-lib
    environment:
      PYTHONPATH: /opt/qi
      LD_LIBRARY_PATH: /opt/boost-lib:/opt/qi-native-lib
      PEPPER_QI_URL: ${PEPPER_QI_URL:-tcp://192.168.210.113:9559}
      SESSION_MANAGER_URL: http://127.0.0.1:8787
    network_mode: host
    restart: unless-stopped

  listener:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/listener.py"]
    volumes:
      - ..:/workspace
    environment:
      LIVEKIT_URL: ws://livekit:7880
      SESSION_MANAGER_URL: http://session-manager:8787
      LIVEKIT_SESSION_FILE: /workspace/data/token-latest.json
      TCP_HOST: host.docker.internal
      TCP_PORT: 55555
      BRIDGE_URL: http://host.docker.internal:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - session-manager
      - livekit
      - bridge
    restart: unless-stopped

  user-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "services/src/user_client.py"]
    volumes:
      - ..:/workspace
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      SESSION_MANAGER_URL: http://127.0.0.1:8787
      LIVEKIT_SESSION_FILE: /workspace/data/token-latest.json
    network_mode: host
    profiles:
      - audio
    restart: unless-stopped

  dev-console:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    working_dir: /workspace
    command: ["uv", "run", "python", "-m", "dev-console.src.app"]
    volumes:
      - ..:/workspace
    environment:
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      DEV_CONSOLE_HOST: "0.0.0.0"
      DEV_CONSOLE_PORT: 8788
    ports:
      - "8788:8788"
    depends_on:
      - weaviate
    profiles:
      - debug
    restart: unless-stopped

  weaviate:
      image: cr.weaviate.io/semitechnologies/weaviate:1.35.1
      ports:
        - "8080:8080"
        - "50051:50051"
      restart: unless-stopped
      environment:
        QUERY_DEFAULTS_LIMIT: 25
        AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
        PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
        DEFAULT_VECTORIZER_MODULE: text2vec-openai
        ENABLE_MODULES: text2vec-openai
        OPENAI_APIKEY: ${OPENAI_API_KEY}
        CLUSTER_HOSTNAME: "node1"
      volumes:
        - ./weaviate_data:/var/lib/weaviate
